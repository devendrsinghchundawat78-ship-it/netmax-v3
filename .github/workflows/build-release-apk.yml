name: Build Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Guard Against Android SVG Drawables
        run: bash scripts/check-no-android-svg.sh

      - name: Generate NETMAX Launcher Resources
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/generate-netmax-icons.py

      - name: Save Generated Launcher Resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src/androidMain/res/mipmap-* composeApp/src/commonMain/composeResources/drawable/app_icon_original.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate NETMAX launcher icon resources at all densities"
            git push origin HEAD:main
          fi

      - name: Prepare Persistent Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing persistent signing secret: $name. Refusing to generate a new key."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          chmod 600 release.jks
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          p = Path('local.properties')
          lines = [line for line in p.read_text().splitlines() if not line.startswith('NUVIO_RELEASE_')]
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'NUVIO_RELEASE_STORE_FILE': 'release.jks', 'NUVIO_RELEASE_STORE_PASSWORD': os.environ['STORE_PASSWORD'], 'NUVIO_RELEASE_KEY_ALIAS': os.environ['KEY_ALIAS'], 'NUVIO_RELEASE_KEY_PASSWORD': os.environ['KEY_PASSWORD']}
          p.write_text('\n'.join(lines + [f'{key}={escape(value)}' for key, value in values.items()]) + '\n')
          PYCONFIG
          keytool -list -keystore release.jks -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS"

      - name: Build Android Full Release APK
        run: |
          echo "=== Building Release APK with Gradle ==="
          ./gradlew :androidApp:assembleFullRelease --stacktrace --no-daemon

      - name: Verify Release APK Output
        id: apk-check
        run: |
          echo "=== Checking Generated Release APK ==="
          ls -la androidApp/build/outputs/apk/full/release/
          
          VERSION=$(grep "MARKETING_VERSION" iosApp/Configuration/Version.xcconfig | cut -d'=' -f2 | tr -d ' ' || echo "3.1.0")
          mkdir -p release-output
          MAIN_APK=$(find androidApp/build/outputs/apk/full/release/ -name "*.apk" | head -n 1)
          if [ -z "$MAIN_APK" ]; then
            echo "Error: No release APK found!" >&2
            exit 1
          fi
          echo "Selected APK: $MAIN_APK"
          cp "$MAIN_APK" "release-output/NetMax-v${VERSION}-release.apk"
          ls -la release-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMax-Release-APK
          path: release-output/NetMax-v*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep "MARKETING_VERSION" iosApp/Configuration/Version.xcconfig | cut -d'=' -f2 | tr -d ' ' || echo "3.1.0")
          TAG_NAME="v${VERSION}-${{ github.run_number }}"
          RELEASE_TITLE="NetMax v${VERSION} Release (Build ${{ github.run_number }})"
          
          echo "Creating Release $TAG_NAME - $RELEASE_TITLE"
          
          gh release create "$TAG_NAME" \
            release-output/NetMax-v*-release.apk \
            --title "$RELEASE_TITLE" \
            --notes "NETMAX v${VERSION}. New Ribbon N + play-slab launcher icon. Persistent release signing required for all future builds. If your installed APK used a different certificate, this transition needs one uninstall/reinstall; back up your settings first. Future APKs signed with the same key and a higher versionCode can update in place." \
            --generate-notes=false
